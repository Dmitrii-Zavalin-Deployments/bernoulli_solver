name: STEP Spatial Metadata Processor

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  automation_core:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 📝 Execute Core Automation Operations
        run: |
          # ------------------------------------------------------------------
          # PLACE YOUR FUTURE INTERACTIVE LOGIC / SCRIPT INVOCATIONS HERE
          # ------------------------------------------------------------------
          echo "$(date '+%Y-%m-%d %H:%M:%S'): Core pipeline execution tick" >> trigger.txt

      - name: 🚀 Deterministic Commit & Notes Push Execution
        run: |
          # Stage the explicit modifications
          git add trigger.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: STEP processor operational update"

            # 🧹 Step 1: Safely isolate runtime or transient file mutations
            git stash --include-untracked

            # 🏁 Step 2: Pull remote branch history to eliminate cross-job drift
            git pull --rebase origin main || echo "No upstream branch adjustments required"

            # 🔓 Step 3: Return workspace modifications to normal state
            git stash pop || echo "Workspace reset complete"

            # 🎯 Step 4: Lock down the finalized, stable post-rebase commit hash
            TARGET_COMMIT=$(git rev-parse HEAD)
            git notes --ref=commits add -f -m "robot: true" $TARGET_COMMIT

            # 🔄 Step 5: Sync separate Git Notes historical tracking tree
            echo "🛰️ Synchronizing Git Notes namespace..."
            git fetch origin refs/notes/commits:refs/notes/commits --force || echo "Initializing new notes database structure."
            git notes merge origin/refs/notes/commits -s cat_sort_uniq || echo "Notes fully aligned."

            # 🚀 Step 6: Perform atomic push sequence (Notes payload must land first)
            git push origin refs/notes/commits
            git push origin HEAD
          else
            echo "Workspace completely clear. No operational commits generated."
          fi