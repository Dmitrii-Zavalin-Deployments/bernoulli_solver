name: STEP Spatial Metadata Processor

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  automation_core:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 🔑 Crucial: Must be 0 so Git knows the history to link notes

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"

      - name: 📝 Make Local Changes
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S'): Core pipeline tick" >> trigger.txt

      - name: 🚀 Commit, Link Note, and Double-Push
        run: |
          git add trigger.txt
          
          if ! git diff --cached --quiet; then
            # 1. Create the local commit on the runner VM
            git commit -m "🤖 robot: STEP processor operational update"

            # 2. Extract the hash of the commit we just created
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 3. Write the metadata note locally to that hash
            git notes --ref=commits add -f -m "robot: true" $TARGET_COMMIT

            # 🚀 4. Push the code branch first
            git push origin HEAD

            # 🚀 5. Explicitly push the notes namespace so GitHub receives it
            git push origin refs/notes/commits
          else
            echo "No changes to commit."
          fi