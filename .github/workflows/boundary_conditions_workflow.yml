name: STEP Spatial Metadata Processor

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  automation_core:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 🔑 Crucial: Must be 0 so Git knows the history to link notes

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"

      - name: 📝 Make Local Changes
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S'): Core pipeline tick" >> trigger.txt

      - name: 🚀 Commit, Link Note, and Sync Notes
        run: |
          git add trigger.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: STEP processor operational update"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1️⃣ Fetch remote notes FIRST
            echo "🛰️ Fetching remote notes..."
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2️⃣ Add the note locally
            echo "📝 Adding note to commit $TARGET_COMMIT"
            git notes --ref=commits add -f -m "robot: true" "$TARGET_COMMIT"

            # 3️⃣ Push commit normally
            git push origin HEAD

            # 4️⃣ Force‑push notes (the ONLY safe method)
            echo "📡 Force‑pushing notes..."
            git push --force origin refs/notes/commits
          else
            echo "No changes to commit."
          fi